# Produzione: stack completo dietro il reverse proxy Caddy di agesci-campania-web-frontend.
# Unico ingresso: il servizio nginx (solo HTTP) sulla rete esterna agesci-proxy, alias
# plancia-nginx; nessuna porta pubblicata. Regole:
# https://raw.githubusercontent.com/AGESCI-Campania/agesci-campania-web-frontend/main/docs/INTEGRAZIONE.md
#
# Installazione e aggiornamento: scripts/installa.sh e scripts/aggiorna.sh (variabili in .env,
# creato da .env.template). Avvio al boot: unit systemd plancia.service (docker compose up -d --wait).
# Profili facoltativi (COMPOSE_PROFILES in .env): mailpit, flower.

x-app-env: &app-env
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DATABASE_URL: postgres://${POSTGRES_USER:-plancia}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}@db:5432/${POSTGRES_DB:-plancia}

# Un'unica immagine, costruita dal servizio web (scripts/installa.sh / aggiorna.sh) e riusata
# da worker, beat e flower: mai scaricata da un registry.
x-app: &app
  image: plancia:locale
  pull_policy: never
  env_file: [.env]
  environment:
    <<: *app-env
  volumes:
    - ./logs:/app/logs              # log Django persistenti sull'host
    - plancia_media:/app/media
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  web:
    <<: *app
    build:
      context: .
      args:
        APP_UID: ${APP_UID:-1000}     # esportati da scripts/_plancia.sh (uid/gid di agesci)
        APP_GID: ${APP_GID:-1000}
    environment:
      <<: *app-env
      ESEGUI_MIGRAZIONI: "1"        # solo il web applica le migrazioni all'avvio (entrypoint)
    healthcheck:
      # Host e X-Forwarded-Proto come li manda Caddy: altrimenti ALLOWED_HOSTS o il redirect HTTPS
      test:
        - CMD
        - python
        - -c
        - |
          import os, urllib.request
          host = os.environ.get("ALLOWED_HOSTS", "localhost").split(",")[0].strip()
          req = urllib.request.Request("http://127.0.0.1:8000/healthz/", headers={"Host": host, "X-Forwarded-Proto": "https"})
          urllib.request.urlopen(req, timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s            # primo avvio: migrazioni

  worker:
    <<: *app
    command: uv run celery -A config worker -l info
    healthcheck:
      test: ["CMD-SHELL", "uv run celery -A config inspect ping -d celery@$$(hostname) --timeout 10"]
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 60s

  beat:
    <<: *app
    command: uv run celery -A config beat -l info --schedule /tmp/celerybeat-schedule
    volumes:
      - ./logs:/app/logs

  nginx:
    image: nginx:1.30.6-alpine
    environment:
      NGINX_ENTRYPOINT_LOCAL_RESOLVERS: "1"   # vedi deploy/nginx/default.conf.template
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      web:
        condition: service_healthy
    networks:
      default:
      agesci-proxy:
        aliases:
          - plancia-nginx
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  db:
    image: postgres:18.7-trixie
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-plancia}
      POSTGRES_USER: ${POSTGRES_USER:-plancia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD mancante in .env}
    volumes:
      # Dalla 18 i dati stanno in /var/lib/postgresql/18/docker (PGDATA): si monta la cartella sopra
      - plancia_db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    volumes:
      - plancia_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.33.1
    # SMTP interno + web UI su /mailadmin/ tramite proxy Django (solo Admin).
    # Da usare solo con la modalità debug Mailpit in Impostazioni.
    profiles: ["mailpit"]
    environment:
      MP_MAX_MESSAGES: 500
      MP_WEBROOT: /mailadmin
    restart: unless-stopped

  flower:
    <<: *app
    # Dashboard Celery su /celery/ tramite proxy Django (solo Admin).
    command: uv run celery -A config flower --url_prefix=celery --port=5555 --address=0.0.0.0
    profiles: ["flower"]
    depends_on:
      redis:
        condition: service_healthy

volumes:
  plancia_db:
  plancia_media:
  plancia_redis:

networks:
  agesci-proxy:
    external: true
