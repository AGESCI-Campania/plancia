[project]
name = "plancia"
version = "2.4.1"
description = "Plancia - Gestione Guidoncini Verdi, AGESCI Campania (Branca E/G)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.3,<6.2",
    "django-allauth[mfa,socialaccount]>=65.22.1",
    "django-pwa>=2.0",
    "django-guardian>=3.5.2",
    "django-axes>=9.0",
    "django-environ>=0.14",
    "psycopg[binary]>=3.3.9",
    "celery[redis]>=5.7",
    "redis>=8.1",
    "whitenoise>=6.8",
    "gunicorn>=27.0.1",
    "uvicorn>=0.54",
    "weasyprint>=70",
    "openpyxl>=3.1",
    "pillow>=13.0",
    "google-api-python-client>=2.202",
    "google-auth>=2.62",
    "google-auth-oauthlib>=1.5",
    "requests>=2.32",
    "django-tinymce>=4.1",
    "django-hijack>=3.8",
    "django-agesci-campania-theme==2.2.2",
    "django-bootstrap-icons>=0.9.0",
    "django-anymail>=15.2",
    "flower>=2.2",
    "odfpy>=1.4.1",
    "django-ninja>=1.8",
    "django-cors-headers>=4.9.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "pytest>=9.2",
    "pytest-django>=4.14",
    "factory-boy>=3.3",
    "django-debug-toolbar>=8.0",
    "pre-commit>=4.7",
    "mypy>=2.4",
    "django-stubs>=6.1.2",
    "playwright>=1.65",
    "selenium>=4.52",
    "webdriver-manager>=4.1.2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "C4", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = ["rate_limit: lascia attivo il rate limit dell'API (vedi conftest.py)"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["^site/", "^tmp/", "/migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings.dev"
